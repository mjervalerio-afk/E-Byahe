name: E_byahe_shuttle
description: "E-Byahe Shuttle — PCU campus shuttle tracking app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  shimmer: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/videos/splash.mp4
    - assets/images/

fltter_launcher_icons:
   android: true
   ios: true
   image_path: "assets/icon/app_icon.png"
   adaptive_icon_background: "#3E5E82"
   adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
   remove_alpha_ios: true
